image boot.vfat {
	vfat {
		files = {
			"bootcode.bin",
			"start_cd.elf",
			"fixup_cd.dat",
			"config.txt",
			"cmdline.txt",
			"Image",
			"bcm2710-rpi-cm0.dtb",
			"bcm2710-rpi-3-b.dtb",
			"overlays"
		}
	}
	size = 128M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}

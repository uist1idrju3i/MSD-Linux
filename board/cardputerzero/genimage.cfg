image bootsel.vfat {
	vfat {
		files = {
			"bootsel/autoboot.txt",
			"bootsel/bootcode.bin"
		}
	}
	size = 16M
}

image boot.vfat {
	vfat {
		files = {
			"boot/start_cd.elf",
			"boot/fixup_cd.dat",
			"boot/config.txt",
			"boot/cmdline_rootfs_a.txt",
			"boot/cmdline_rootfs_b.txt",
			"boot/kernel8.img",
			"boot/bcm2710-rpi-cm0.dtb",
			"boot/bcm2710-rpi-3-b.dtb",
			"boot/overlays"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "data"
		use-mke2fs = "true"
	}
	empty = "true"
	size = 64M
}

image sdcard.img {
	hdimage {
		align = 4M
		partition-table-type = "mbr"
		extended-partition = 4
	}

	partition bootsel {
		partition-type = 0xC
		bootable = "true"
		image = "bootsel.vfat"
		size = 16M
	}

	partition boot-a {
		partition-type = 0xC
		image = "boot.vfat"
		size = 64M
	}

	partition boot-b {
		partition-type = 0xC
		image = "boot.vfat"
		size = 64M
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
		size = 64M
	}
}

image bootsel.vfat {
	vfat {
		files = {
			"bootsel/autoboot.txt",
			"bootsel/bootcode.bin"
		}
	}
	size = 16M
}

image boot-a.vfat {
	vfat {
		files = {
			"boot-a/start_cd.elf",
			"boot-a/fixup_cd.dat",
			"boot-a/config.txt",
			"boot-a/cmdline.txt",
			"boot-a/kernel8.img",
			"boot-a/bcm2710-rpi-cm0.dtb",
			"boot-a/bcm2710-rpi-3-b.dtb",
			"boot-a/overlays"
		}
	}
	size = 64M
}

image boot-b.vfat {
	vfat {
		files = {
			"boot-b/start_cd.elf",
			"boot-b/fixup_cd.dat",
			"boot-b/config.txt",
			"boot-b/cmdline.txt",
			"boot-b/kernel8.img",
			"boot-b/bcm2710-rpi-cm0.dtb",
			"boot-b/bcm2710-rpi-3-b.dtb",
			"boot-b/overlays"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "data"
		use-mke2fs = "true"
	}
	empty = "true"
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		extended-partition = 4
	}

	partition bootsel {
		partition-type = 0xC
		bootable = "true"
		image = "bootsel.vfat"
		size = 16M
	}

	partition boot-a {
		partition-type = 0xC
		image = "boot-a.vfat"
		size = 64M
	}

	partition boot-b {
		partition-type = 0xC
		image = "boot-b.vfat"
		size = 64M
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
		size = 64M
	}
}

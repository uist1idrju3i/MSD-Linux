paths:
  .github/workflows/*.yml:
    ignore:
      # actionlint does not yet recognize these GitHub-hosted runner labels.
      - 'label "ubuntu-26.04" is unknown'
      - 'label "ubuntu-26.04-arm" is unknown'
      # actionlint 1.7.12 predates GitHub's self-repository syntax (July 2026).
      # Exact path only; tests/check-ci-cache checks this exception and its pin.
      - '^specifying action "\$/\.github/actions/setup-dev-image" in invalid format because ref is missing\.'

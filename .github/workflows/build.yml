name: Buildroot build and QEMU smoke test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: Check whether the build is needed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]] &&
             ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags origin \
              "refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [[ ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
             git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              diff_range="${BASE_SHA}...${HEAD_SHA}"
            else
              diff_range="${BASE_SHA}..${HEAD_SHA}"
            fi
            if ! git diff --name-only -z "$diff_range" > "$RUNNER_TEMP/changed-files"; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          build=false
          while IFS= read -r -d '' path; do
            case "$path" in
              *.md|docs/*|.agents/*|.claude/*|vendor/yomiyasu|LICENSE)
                ;;
              *)
                build=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  msd-update-tests:
    name: MSD host tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fdisk e2fsprogs openssl

      - name: Run host tests
        run: |
          tests/msd-update/run.sh
          tests/msd-hwinfo/run.sh
          tests/msd-data-grow/run.sh

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio device-tree-compiler fdisk \
            file flex git libelf-dev libncurses-dev libssl-dev perl python3 \
            qemu-system-arm rsync unzip wget xz-utils

      - id: dl-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dl
          key: buildroot-dl-${{ runner.os }}-${{ hashFiles('configs/msd_cardputerzero_defconfig','package/**/*.mk','package/**/*.hash') }}
          restore-keys: buildroot-dl-${{ runner.os }}-

      - id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: buildroot-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: buildroot-ccache-${{ runner.os }}-

      - name: Configure Buildroot
        env:
          BR2_DL_DIR: ${{ github.workspace }}/dl
          BR2_CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          make -C vendor/buildroot \
            BR2_EXTERNAL="${GITHUB_WORKSPACE}" \
            O="${GITHUB_WORKSPACE}/output" \
            msd_cardputerzero_defconfig

      - id: buildroot-build
        name: Build image and legal information
        env:
          BR2_DL_DIR: ${{ github.workspace }}/dl
          BR2_CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 3G
        run: |
          make -C output -j"$(nproc)"
          make -C output legal-info

      - name: Generate SBOM
        run: |
          set -o pipefail
          make -s -C output show-info |
            python3 vendor/buildroot/utils/generate-cyclonedx \
              --project-name msd-linux \
              --project-version "$GITHUB_SHA" \
              > output/images/sbom.cdx.json

      - name: Run kernel hardening checker
        continue-on-error: true
        run: |
          set -euo pipefail
          checker_dir="$RUNNER_TEMP/kernel-hardening-checker"
          git clone --depth 1 --branch v0.6.17.1 \
            https://github.com/a13xp0p0v/kernel-hardening-checker "$checker_dir"
          test "$(git -C "$checker_dir" rev-parse HEAD)" = \
            afc376f2a935994793343cfeb05953583cc30191
          "$checker_dir/bin/kernel-hardening-checker" \
            -c output/build/linux-custom/.config \
            -l board/cardputerzero/cmdline_rootfs_a.txt \
            -m json \
            > output/images/kernel-hardening.json

      - name: Summarize kernel hardening results
        if: always()
        continue-on-error: true
        run: |
          python3 - output/images/kernel-hardening.json >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          report = pathlib.Path(sys.argv[1])
          if not report.is_file():
              print("## Kernel hardening checker\n\nNo JSON report was produced.")
              raise SystemExit(0)

          checks = json.loads(report.read_text())
          passed = [item for item in checks if item.get("check_result_bool")]
          failed = [item for item in checks if not item.get("check_result_bool")]
          print("## Kernel hardening checker")
          print(f"\n- OK: {len(passed)}")
          print(f"- FAIL: {len(failed)}")
          if failed:
              print("\n### FAIL")
              for item in failed:
                  print(f"- `{item['option_name']}`: {item['check_result']}")
          PY

      - name: Show ccache statistics
        if: always()
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          if [[ -x output/host/bin/ccache ]]; then
            output/host/bin/ccache -s
          else
            echo "ccache binary is not available"
          fi

      - name: Check image partition layout
        run: board/cardputerzero/check-image-layout.sh output/images/sdcard.img

      - name: QEMU smoke test
        run: board/cardputerzero/qemu/test-boot.sh

      - name: QEMU B-slot smoke test
        run: board/cardputerzero/qemu/test-ab.sh

      - name: Package artifacts
        if: ${{ !cancelled() && steps.buildroot-build.outcome == 'success' }}
        run: |
          xz -T0 -k output/images/sdcard.img
          tar -czf output/legal-info.tar.gz -C output legal-info

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.buildroot-build.outcome == 'success' }}
        with:
          name: msd-cardputerzero-build
          path: |
            output/images/sdcard.img.xz
            output/images/Image
            output/images/kernel8.img
            output/images/bcm2710-rpi-3-b.dtb
            output/images/bcm2710-rpi-cm0.dtb
            output/images/sbom.cdx.json
            output/legal-info.tar.gz

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.dl-restore.outputs.cache-hit != 'true'
        with:
          path: dl
          key: buildroot-dl-${{ runner.os }}-${{ hashFiles('configs/msd_cardputerzero_defconfig','package/**/*.mk','package/**/*.hash') }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .ccache
          key: buildroot-ccache-${{ runner.os }}-${{ github.run_id }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-time-log
          path: output/build/build-time.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kernel-hardening-report
          path: output/images/kernel-hardening.json
          if-no-files-found: ignore

name: Buildroot build and QEMU smoke test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 1"

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: Check whether the build is needed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" && "$EVENT_NAME" != "push" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]] &&
             ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags origin \
              "refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [[ ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
             git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            diff_range="${BASE_SHA}...${HEAD_SHA}"
            if ! git diff --name-only -z "$diff_range" > "$RUNNER_TEMP/changed-files"; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          build=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/build.yml)
                build=true
                break
                ;;
              *.md|docs/*|public_html/*|.agents/*|.claude/*|vendor/yomiyasu|LICENSE|.devin/*|tests/check-*/*|.github/*)
                ;;
              *)
                build=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  msd-update-tests:
    name: MSD tests in development image
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GHCR_ACTOR" \
            --password-stdin

      - name: Ensure development image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSD_DEV_REQUIRE_ATTESTATION: "1"
        run: docker/msd-dev ensure 2>&1 | tee "$RUNNER_TEMP/msd-ensure.log"

      - name: Run tests in the development image
        run: |
          docker/msd-dev tests/msd-update/run.sh
          docker/msd-dev tests/msd-hwinfo/run.sh
          docker/msd-dev tests/msd-data-grow/run.sh
          docker/msd-dev tests/qemu-log-check/run.sh
          docker/msd-dev tests/msd-dev/run.sh
          docker/msd-dev tests/trivy-gate/run.sh

      - name: Summarize step timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MSD_JOB_NAME: MSD tests in development image
        run: |
          # shellcheck disable=SC2016
          step_lines="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" --paginate --jq '
            .jobs[] | select(.name == env.MSD_JOB_NAME) as $job |
            "=ci-meta=\tjob_started_at\t\($job.started_at)",
            ($job.steps[] | select(.completed_at != null) |
              "=step-time=\t\(.number)\t\(.name)\t\(.started_at)\t\(.completed_at)\t\(if .started_at == null then "unknown" else ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) end)\t\(.conclusion)")
          ' 2>/dev/null)" || step_lines=""
          if [[ -n "$step_lines" ]]; then
            printf '%s\n' "$step_lines"
          else
            printf '=ci-meta=\tjob_started_at\tunknown\n'
          fi
          ensure_log="$RUNNER_TEMP/msd-ensure.log"
          if [[ ! -f "$ensure_log" ]]; then ensure_state=missing
          elif grep -Fq 'Published image' "$ensure_log" && grep -Fq 'found.' "$ensure_log"; then ensure_state=published
          elif grep -Fq 'building locally' "$ensure_log"; then ensure_state=local-build
          else ensure_state=unknown; fi
          printf '=ci-meta=\tensure\t%s\n' "$ensure_state"
          {
            printf '| # | Step | Started at | Completed at | Seconds | Conclusion |\n'
            printf '|---:|---|---|---|---:|---|\n'
            printf '%s\n' "$step_lines" | awk -F '\t' '$1 == "=step-time=" { printf "| %s | %s | %s | %s | %s | %s |\n", $2, $3, $4, $5, $6, $7 }'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GHCR_ACTOR" \
            --password-stdin

      - name: Ensure development image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSD_DEV_REQUIRE_ATTESTATION: "1"
        run: docker/msd-dev ensure 2>&1 | tee "$RUNNER_TEMP/msd-ensure.log"

      - id: dl-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dl
          key: buildroot-dl-${{ runner.os }}-${{ hashFiles('configs/msd_cardputerzero_defconfig','package/**/*.mk','package/**/*.hash') }}
          restore-keys: buildroot-dl-${{ runner.os }}-

      - id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: buildroot-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: buildroot-ccache-${{ runner.os }}-

      - name: Configure Buildroot
        env:
          BR2_DL_DIR: ${{ github.workspace }}/dl
          BR2_CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          docker/msd-dev bash -c '
            make -C vendor/buildroot \
              BR2_EXTERNAL=/work \
              O=/work/output \
              msd_cardputerzero_defconfig
          '

      - id: buildroot-build
        name: Build image and legal information
        env:
          BR2_DL_DIR: ${{ github.workspace }}/dl
          BR2_CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 3G
        run: |
          # shellcheck disable=SC2016
          docker/msd-dev bash -c '
            make -C output host-ccache
            CCACHE_DIR="${BR2_CCACHE_DIR}" output/host/bin/ccache -z
            make -C output -j"$(nproc)"
            make -C output legal-info
          '

      - name: Check module dependency index
        run: docker/msd-dev board/cardputerzero/tools/check-modules-dep.sh output/target

      - name: Check kernel fragment and image tool versions
        run: |
          docker/msd-dev bash -c '
            board/cardputerzero/tools/check-kernel-fragment.sh \
              board/cardputerzero/linux.fragment \
              output/build/linux-custom/.config
            output/host/sbin/mke2fs -V
            output/host/bin/mksquashfs -version
            output/host/bin/genimage --version
            if ! dumpe2fs -h output/images/data.ext4 2>/dev/null |
              grep -Eq "^Block size:[[:space:]]+4096$"; then
              printf "%s\n" "data.ext4 must use 4096-byte blocks." >&2
              exit 1
            fi
          '

      - name: Generate SBOM
        run: |
          # shellcheck disable=SC2016
          docker/msd-dev bash -c '
            set -o pipefail
            make -s -C output show-info |
              python3 vendor/buildroot/utils/generate-cyclonedx \
                --project-name msd-linux \
                --project-version "$GITHUB_SHA" \
                > output/images/sbom.cdx.json
          '

      - name: Run kernel hardening checker
        continue-on-error: true
        env:
          KHC_TAG: v0.6.17.1
          KHC_COMMIT: afc376f2a935994793343cfeb05953583cc30191
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          docker/msd-dev bash -c '
            set -euo pipefail
            checker_dir=/tmp/kernel-hardening-checker
            git clone --depth 1 --branch "$KHC_TAG" \
              https://github.com/a13xp0p0v/kernel-hardening-checker "$checker_dir"
            test "$(git -C "$checker_dir" rev-parse HEAD)" = "$KHC_COMMIT"
            "$checker_dir/bin/kernel-hardening-checker" \
              -c output/build/linux-custom/.config \
              -l board/cardputerzero/cmdline_rootfs_a.txt \
              -m json \
              > output/images/kernel-hardening.json
          '

      - name: Summarize kernel hardening results
        if: always()
        continue-on-error: true
        run: |
          python3 - output/images/kernel-hardening.json >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          report = pathlib.Path(sys.argv[1])
          if not report.is_file():
              print("## Kernel hardening checker\n\nNo JSON report was produced.")
              raise SystemExit(0)

          checks = json.loads(report.read_text())
          passed = [item for item in checks if item.get("check_result_bool")]
          failed = [item for item in checks if not item.get("check_result_bool")]
          print("## Kernel hardening checker")
          print(f"\n- OK: {len(passed)}")
          print(f"- FAIL: {len(failed)}")
          if failed:
              print("\n### FAIL")
              for item in failed:
                  print(f"- `{item['option_name']}`: {item['check_result']}")
          PY

      - name: Show ccache statistics
        shell: bash
        if: always()
        env:
          BR2_CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          # shellcheck disable=SC2016
          docker/msd-dev bash -c '
            if [[ -x output/host/bin/ccache ]]; then
              CCACHE_DIR="${BR2_CCACHE_DIR}" output/host/bin/ccache -s
            else
              echo "ccache binary is not available"
            fi
          ' 2>&1 | tee "$RUNNER_TEMP/msd-ccache.log"

      - name: Check image partition layout
        run: docker/msd-dev board/cardputerzero/check-image-layout.sh output/images/sdcard.img

      - name: Prepare QEMU serial log directory
        run: mkdir -p output/qemu-logs

      - name: QEMU smoke test
        env:
          QEMU_LOG_DIR: ${{ github.workspace }}/output/qemu-logs
        run: docker/msd-dev board/cardputerzero/qemu/test-boot.sh

      - name: QEMU B-slot smoke test
        env:
          QEMU_LOG_DIR: ${{ github.workspace }}/output/qemu-logs
        run: docker/msd-dev board/cardputerzero/qemu/test-ab.sh

      - name: QEMU GPIO6 power-fail smoke test
        env:
          QEMU_LOG_DIR: ${{ github.workspace }}/output/qemu-logs
        run: docker/msd-dev board/cardputerzero/qemu/test-powerfail.sh --smoke

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qemu-serial-logs
          path: output/qemu-logs/
          if-no-files-found: ignore

      - name: Package artifacts
        if: ${{ !cancelled() && steps.buildroot-build.outcome == 'success' }}
        run: |
          docker/msd-dev bash -c '
            xz -T0 -k output/images/sdcard.img
            tar -czf output/legal-info.tar.gz -C output legal-info
          '

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.buildroot-build.outcome == 'success' }}
        with:
          name: msd-cardputerzero-build
          # output/build/linux-*/.config is a dotfile; upload-artifact skips those by default.
          include-hidden-files: true
          path: |
            output/images/sdcard.img.xz
            output/images/Image
            output/images/kernel8.img
            output/images/bcm2710-rpi-3-b.dtb
            output/images/bcm2710-rpi-cm0.dtb
            output/build/linux-*/.config
            output/images/sbom.cdx.json
            output/legal-info.tar.gz

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.dl-restore.outputs.cache-hit != 'true' && steps.buildroot-build.outcome == 'success'
        with:
          path: dl
          key: buildroot-dl-${{ runner.os }}-${{ hashFiles('configs/msd_cardputerzero_defconfig','package/**/*.mk','package/**/*.hash') }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.buildroot-build.outcome == 'success'
        with:
          path: .ccache
          key: buildroot-ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Summarize step timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MSD_JOB_NAME: build
        run: |
          # shellcheck disable=SC2016
          step_lines="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" --paginate --jq '
            .jobs[] | select(.name == env.MSD_JOB_NAME) as $job |
            "=ci-meta=\tjob_started_at\t\($job.started_at)",
            ($job.steps[] | select(.completed_at != null) |
              "=step-time=\t\(.number)\t\(.name)\t\(.started_at)\t\(.completed_at)\t\(if .started_at == null then "unknown" else ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) end)\t\(.conclusion)")
          ' 2>/dev/null)" || step_lines=""
          if [[ -n "$step_lines" ]]; then
            printf '%s\n' "$step_lines"
          else
            printf '=ci-meta=\tjob_started_at\tunknown\n'
          fi
          ensure_log="$RUNNER_TEMP/msd-ensure.log"
          if [[ ! -f "$ensure_log" ]]; then ensure_state=missing
          elif grep -Fq 'Published image' "$ensure_log" && grep -Fq 'found.' "$ensure_log"; then ensure_state=published
          elif grep -Fq 'building locally' "$ensure_log"; then ensure_state=local-build
          else ensure_state=unknown; fi
          printf '=ci-meta=\tensure\t%s\n' "$ensure_state"
          if [[ ! -f "$RUNNER_TEMP/msd-ccache.log" ]]; then
            printf '=ci-meta=\tccache\tmissing\n'
          else
            sed 's/^/=ci-meta=\tccache\t/' "$RUNNER_TEMP/msd-ccache.log"
          fi
          {
            printf '| # | Step | Started at | Completed at | Seconds | Conclusion |\n'
            printf '|---:|---|---|---|---:|---|\n'
            printf '%s\n' "$step_lines" | awk -F '\t' '$1 == "=step-time=" { printf "| %s | %s | %s | %s | %s | %s |\n", $2, $3, $4, $5, $6, $7 }'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-time-log
          path: output/build/build-time.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kernel-hardening-report
          path: output/images/kernel-hardening.json
          if-no-files-found: ignore

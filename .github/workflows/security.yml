name: Security report

on:
  schedule:
    - cron: "25 */2 * * *"
  workflow_dispatch:
  pull_request:

concurrency:
  group: security-report-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  scan:
    name: product CVE scan
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GHCR_ACTOR" \
            --password-stdin

      - id: dev-image
        name: Ensure development image
        uses: ./.github/actions/setup-dev-image # zizmor: ignore[self-repository] -- source archives cannot resolve vendor-backed skill symlinks; use the checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Buildroot
        run: |
          docker/msd-dev make -C vendor/buildroot \
            BR2_EXTERNAL=/work O=/work/output msd_cardputerzero_defconfig

      - name: Generate SBOM
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          docker/msd-dev mkdir -p output/images
          docker/msd-dev make -s -C output show-info > output/images/buildroot-show-info.json
          docker/msd-dev python3 vendor/buildroot/utils/generate-cyclonedx \
            --in-file output/images/buildroot-show-info.json \
            --project-name msd-linux --project-version "$GITHUB_SHA" \
            > output/images/sbom.cdx.json

      - name: Set kernel version in SBOM
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          docker/msd-dev python3 .github/scripts/set-kernel-version.py \
            output/images/sbom.cdx.json \
            --show-info output/images/buildroot-show-info.json \
            --project-version "$GITHUB_SHA"

      - name: Clone current NVD feed
        run: |
          docker/msd-dev mkdir -p dl/buildroot-nvd
          docker/msd-dev git clone --depth 1 \
            https://github.com/fkie-cad/nvd-json-data-feeds dl/buildroot-nvd/git
          docker/msd-dev git -C dl/buildroot-nvd/git rev-parse HEAD \
            > output/images/nvd-feed-sha.txt
          docker/msd-dev git -C dl/buildroot-nvd/git log -1 --format=%ct \
            > output/images/nvd-feed-commit-time.txt

      - name: Run Buildroot CVE analysis
        run: |
          docker/msd-dev python3 .github/scripts/cve-monitor.py cve-check \
            --nvd-path /work/dl/buildroot-nvd \
            --no-nvd-update --include-resolved \
            --in-file /work/output/images/sbom.cdx.json \
            --out-file /work/output/images/vex.cdx.json

      - name: Summarize CVE analysis
        run: |
          docker/msd-dev python3 .github/scripts/summarize-vex.py \
            output/images/vex.cdx.json >> "$GITHUB_STEP_SUMMARY"

      - name: Generate monitor state
        run: |
          docker/msd-dev python3 .github/scripts/cve-monitor.py state \
            --sbom output/images/sbom.cdx.json \
            --vex output/images/vex.cdx.json \
            --exceptions .github/cve-exceptions.tsv \
            --feed-commit-time "$(docker/msd-dev cat output/images/nvd-feed-commit-time.txt)" \
            --feed-sha "$(docker/msd-dev cat output/images/nvd-feed-sha.txt)" \
            --now "$(docker/msd-dev date -u +%s)" \
            --output output/images/state.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          submodules: true
          persist-credentials: false

      - name: Configure base Buildroot
        if: github.event_name == 'pull_request'
        run: |
          docker/msd-dev make -C base/vendor/buildroot \
            BR2_EXTERNAL=/work/base O=/work/base/output msd_cardputerzero_defconfig

      - name: Generate base SBOM
        if: github.event_name == 'pull_request'
        run: |
          docker/msd-dev mkdir -p base/output/images
          docker/msd-dev make -s -C base/output show-info \
            > base/output/images/buildroot-show-info.json
          docker/msd-dev python3 vendor/buildroot/utils/generate-cyclonedx \
            --in-file base/output/images/buildroot-show-info.json \
            --project-name msd-linux \
            --project-version "$(docker/msd-dev git -C base rev-parse HEAD)" \
            > base/output/images/sbom.cdx.json

      - name: Set base kernel version in SBOM
        if: github.event_name == 'pull_request'
        run: |
          docker/msd-dev bash -c "cd /work/base && \
            python3 /work/.github/scripts/set-kernel-version.py \
              output/images/sbom.cdx.json \
              --show-info output/images/buildroot-show-info.json \
              --project-version \"\$(git rev-parse HEAD)\""

      - name: Run base Buildroot CVE analysis
        if: github.event_name == 'pull_request'
        run: |
          docker/msd-dev python3 .github/scripts/cve-monitor.py cve-check \
            --nvd-path /work/dl/buildroot-nvd \
            --no-nvd-update --include-resolved \
            --in-file /work/base/output/images/sbom.cdx.json \
            --out-file /work/base/output/images/vex.cdx.json

      - name: Generate base monitor state
        if: github.event_name == 'pull_request'
        run: |
          docker/msd-dev python3 .github/scripts/cve-monitor.py state \
            --sbom base/output/images/sbom.cdx.json \
            --vex base/output/images/vex.cdx.json \
            --exceptions .github/cve-exceptions.tsv \
            --feed-commit-time "$(docker/msd-dev cat output/images/nvd-feed-commit-time.txt)" \
            --feed-sha "$(docker/msd-dev cat output/images/nvd-feed-sha.txt)" \
            --now "$(docker/msd-dev date -u +%s)" \
            --output base/output/images/state.json

      - name: Check PR CVE gate
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          docker/msd-dev python3 .github/scripts/cve-monitor.py pr-gate \
            --base-state base/output/images/state.json \
            --head-state output/images/state.json \
            --head-sbom output/images/sbom.cdx.json \
            --nvd-path /work/dl/buildroot-nvd \
            | tee output/images/pr-gate-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'pull_request'
        with:
          name: product-cve-pr-gate
          path: |
            base/output/images/state.json
            base/output/images/sbom.cdx.json
            base/output/images/vex.cdx.json
            output/images/pr-gate-summary.md
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: product-cve-state
          path: |
            output/images/state.json
            output/images/sbom.cdx.json
            output/images/vex.cdx.json
            output/images/buildroot-show-info.json
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: product-cve-state
          path: |
            output/images/state.json
            output/images/sbom.cdx.json
            output/images/vex.cdx.json
            output/images/buildroot-show-info.json
          retention-days: 30
          if-no-files-found: ignore

  report:
    needs: scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      issues: write
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ISSUE_TITLE: 製品SBOMの脆弱性監視
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download current state
        env:
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          mkdir -p report/current
          gh run download "$CURRENT_RUN" -n product-cve-state --dir report/current

      - name: Find previous successful state
        id: previous
        env:
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          mkdir -p report/previous
          runs="$(gh run list --workflow security.yml --branch main --status success --json databaseId -L 5)"
          while IFS= read -r run_id; do
            [[ -n "$run_id" && "$run_id" != "$CURRENT_RUN" ]] || continue
            if gh run download "$run_id" -n product-cve-state --dir report/previous; then
              if [[ -f report/previous/state.json ]]; then
                printf 'available=true\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            rm -f report/previous/*
          done < <(printf '%s' "$runs" | python3 -c 'import json,sys; print("\n".join(str(x["databaseId"]) for x in json.load(sys.stdin)))')
          printf 'available=false\n' >> "$GITHUB_OUTPUT"

      - name: Update tracking issue
        env:
          PREVIOUS_AVAILABLE: ${{ steps.previous.outputs.available }}
        run: |
          python3 .github/scripts/cve-monitor.py issue-body \
            --state report/current/state.json --run-url "$RUN_URL" \
            > report/issue-body.md
          issues="$(gh issue list --state open --json number,title -L 100)"
          issue_number="$(printf '%s' "$issues" | python3 -c \
            'import json,os,sys; print(next((str(i["number"]) for i in json.load(sys.stdin) if i["title"] == os.environ["ISSUE_TITLE"]), ""))')"
          if [[ -z "$issue_number" ]]; then
            issue_number="$(gh issue create --title "$ISSUE_TITLE" --body-file report/issue-body.md)"
            issue_number="${issue_number##*/}"
          else
            gh issue edit "$issue_number" --body-file report/issue-body.md
          fi
          if [[ "$PREVIOUS_AVAILABLE" != true ]]; then
            printf '基準を作成しました\n\n%s\n' "$RUN_URL" > report/diff.md
          else
            python3 .github/scripts/cve-monitor.py diff \
              --previous report/previous/state.json \
              --current report/current/state.json --run-url "$RUN_URL" \
              > report/diff.md
          fi
          if [[ -s report/diff.md ]]; then
            gh issue comment "$issue_number" --body-file report/diff.md
          fi

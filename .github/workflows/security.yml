name: Security report

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-report:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Configure Buildroot
        run: |
          make -C vendor/buildroot \
            BR2_EXTERNAL="$GITHUB_WORKSPACE" \
            O="$GITHUB_WORKSPACE/output" \
            msd_cardputerzero_defconfig

      - name: Generate SBOM
        run: |
          mkdir -p output/images
          set -o pipefail
          make -s -C output show-info |
            python3 vendor/buildroot/utils/generate-cyclonedx \
              --project-name msd-linux \
              --project-version "$GITHUB_SHA" \
              > output/images/sbom.cdx.json

      - name: Set kernel version in SBOM
        run: python3 .github/scripts/set-kernel-version.py output/images/sbom.cdx.json

      - id: iso-week
        name: Determine NVD cache week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - id: nvd-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dl/buildroot-nvd
          key: buildroot-nvd-${{ runner.os }}-${{ steps.iso-week.outputs.key }}
          restore-keys: buildroot-nvd-${{ runner.os }}-

      - name: Update shallow NVD mirror
        id: nvd-update
        run: |
          set -euo pipefail
          mirror=dl/buildroot-nvd/git
          if [[ ! -d "$mirror/.git" ]]; then
            mkdir -p dl/buildroot-nvd
            git clone --depth 1 \
              https://github.com/fkie-cad/nvd-json-data-feeds "$mirror"
          else
            git -C "$mirror" fetch --depth 1 origin
            git -C "$mirror" reset --hard FETCH_HEAD
          fi

      - name: Run Buildroot CVE analysis
        run: |
          python3 vendor/buildroot/support/scripts/cve-check \
            --nvd-path dl/buildroot-nvd \
            --no-nvd-update \
            --include-resolved \
            < output/images/sbom.cdx.json \
            > output/images/vex.cdx.json

      - name: Summarize CVE analysis
        run: |
          python3 .github/scripts/summarize-vex.py output/images/vex.cdx.json \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.nvd-restore.outputs.cache-hit != 'true' && steps.nvd-update.outcome == 'success'
        with:
          path: dl/buildroot-nvd
          key: buildroot-nvd-${{ runner.os }}-${{ steps.iso-week.outputs.key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: buildroot-security-report
          path: |
            output/images/sbom.cdx.json
            output/images/vex.cdx.json
          if-no-files-found: ignore

name: agent-docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: AGENTS.md が存在する
        run: test -f AGENTS.md

      - name: スキルのシンボリックリンクが SKILL.md に解決される
        run: |
          for link in .agents/skills/* .claude/skills/*; do
            if [ -L "$link" ]; then
              echo "check: $link"
              test -f "$link/SKILL.md" || {
                echo "::error::$link が SKILL.md を指していません。submodule の取得とリンク先を確認してください。"
                exit 1
              }
            fi
          done

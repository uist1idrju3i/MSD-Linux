name: Scan development image

on:
  push:
    branches:
      - main
    paths:
      - docker/msd-dev.Dockerfile
      - docker/debian.sources
      - docker/msd-dev
      - .github/zizmor-requirements.txt
      - docker/qemu-patches/**
      - docker/qemu-signing-key.asc
      - .github/workflows/dev-image-scan.yml
  schedule:
    - cron: "31 7 * * 1"
  workflow_dispatch:

concurrency:
  group: monitor-dev-image
  cancel-in-progress: false

permissions: {}

env:
  TRIVY_VERSION: "0.76.1"
  TRIVY_DIGEST: "sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c"

jobs:
  scan:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: pull
        name: Pull latest development image
        env:
          IMAGE: ghcr.io/uist1idrju3i/msd-dev:latest
        run: |
          pull_log="$RUNNER_TEMP/docker-pull.log"
          if docker pull --platform linux/amd64 "$IMAGE" > "$pull_log" 2>&1; then
            cat "$pull_log"
            image_id="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
            docker image inspect "$image_id" --format \
              '{"image_id":{{json .Id}},"repo_digests":{{json .RepoDigests}},"os":{{json .Os}},"architecture":{{json .Architecture}}}' \
              > "$RUNNER_TEMP/image-provenance.json"
            docker save --output "$RUNNER_TEMP/msd-dev.tar" "$image_id"
            echo 'image_available=true' >> "$GITHUB_OUTPUT"
          else
            cat "$pull_log" >&2
            printf '%s\n' 'Development image could not be scanned because docker pull failed.' >&2
            exit 1
          fi

      - name: Prepare Trivy cache
        if: steps.pull.outputs.image_available == 'true'
        run: mkdir -p "$RUNNER_TEMP/trivy-cache"

      - name: Scan latest image
        if: steps.pull.outputs.image_available == 'true'
        env:
          IMAGE: ghcr.io/uist1idrju3i/msd-dev:latest
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP:/work" \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}:${TRIVY_VERSION}@${TRIVY_DIGEST}" \
            image --input /work/msd-dev.tar \
            --scanners vuln,secret,misconfig \
            --format json \
            --output /work/trivy.json
          docker run --rm \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}:${TRIVY_VERSION}@${TRIVY_DIGEST}" \
            --version > "$RUNNER_TEMP/trivy-version.txt"

      - id: report
        name: Report latest image findings
        if: steps.pull.outputs.image_available == 'true'
        run: |
          set -o pipefail
          python3 .github/scripts/trivy-gate.py report "$RUNNER_TEMP/trivy.json" \
            --findings-json "$RUNNER_TEMP/trivy-findings.json" \
            --github-output "$GITHUB_OUTPUT" |
            tee "$RUNNER_TEMP/trivy-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve sanitized scan findings
        if: always() && steps.pull.outputs.image_available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-image-findings
          path: |
            ${{ runner.temp }}/image-provenance.json
            ${{ runner.temp }}/trivy-findings.json
            ${{ runner.temp }}/trivy-report.md
            ${{ runner.temp }}/trivy-version.txt
          if-no-files-found: warn

      - name: Maintain vulnerability issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_FINDINGS: ${{ steps.report.outputs.has_findings }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          SCAN_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status=failed
          if [[ "$SCAN_STATUS" == success && "$REPORT_OUTCOME" == success ]]; then
            case "$HAS_FINDINGS" in
              true) status=findings ;;
              false) status=clear ;;
            esac
          fi
          python3 .github/scripts/tracking-issue.py --title "開発用イメージの脆弱性" \
            --status "$status" --body-file "$RUNNER_TEMP/trivy-report.md" --run-url "$RUN_URL"

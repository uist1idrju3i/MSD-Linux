name: Scan development image

on:
  push:
    branches:
      - main
    paths:
      - docker/msd-dev.Dockerfile
      - docker/debian.sources
      - docker/msd-dev
      - .github/zizmor-requirements.txt
      - docker/qemu-patches/**
      - docker/qemu-signing-key.asc
      - .github/workflows/dev-image-scan.yml
  schedule:
    - cron: "31 7 * * 1"
  workflow_dispatch:

concurrency:
  group: monitor-dev-image
  cancel-in-progress: false

permissions: {}

env:
  TRIVY_VERSION: "0.76.1"
  TRIVY_DIGEST: "sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c"

jobs:
  resolve:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - id: resolve
        name: Resolve the published image index once
        env:
          IMAGE: ghcr.io/uist1idrju3i/msd-dev:latest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' |
            jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
          printf 'image=ghcr.io/uist1idrju3i/msd-dev@%s\n' "$digest" >> "$GITHUB_OUTPUT"

  scan:
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: pull
        name: Pull latest development image
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          pull_log="$RUNNER_TEMP/docker-pull.log"
          if docker pull --platform "linux/$ARCH" "$IMAGE" > "$pull_log" 2>&1; then
            cat "$pull_log"
            image_id="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
            architecture="$(docker image inspect "$image_id" --format '{{.Architecture}}')"
            os="$(docker image inspect "$image_id" --format '{{.Os}}')"
            if [[ "$architecture" != "$ARCH" || "$os" != "linux" ]]; then
              printf 'Pulled image does not match the requested platform.\n' >&2
              exit 1
            fi
            docker image inspect "$image_id" --format \
              '{"image_id":{{json .Id}},"repo_digests":{{json .RepoDigests}},"os":{{json .Os}},"architecture":{{json .Architecture}}}' \
              > "$RUNNER_TEMP/image-provenance.json"
            docker save --output "$RUNNER_TEMP/msd-dev.tar" "$image_id"
            echo 'image_available=true' >> "$GITHUB_OUTPUT"
          else
            cat "$pull_log" >&2
            printf '%s\n' 'Development image could not be scanned because docker pull failed.' >&2
            exit 1
          fi

      - name: Prepare Trivy cache
        if: steps.pull.outputs.image_available == 'true'
        run: mkdir -p "$RUNNER_TEMP/trivy-cache"

      - name: Scan latest image
        if: steps.pull.outputs.image_available == 'true'
        env:
          IMAGE: ghcr.io/uist1idrju3i/msd-dev:latest
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP:/work" \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}:${TRIVY_VERSION}@${TRIVY_DIGEST}" \
            image --input /work/msd-dev.tar \
            --scanners vuln,secret,misconfig \
            --format json \
            --output /work/trivy.json
          docker run --rm \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}:${TRIVY_VERSION}@${TRIVY_DIGEST}" \
            --version > "$RUNNER_TEMP/trivy-version.txt"

      - id: report
        name: Report latest image findings
        if: steps.pull.outputs.image_available == 'true'
        run: |
          set -o pipefail
          python3 - "$RUNNER_TEMP/trivy.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as source:
              report = json.load(source)
          if not isinstance(report, dict) or not isinstance(report.get("Results"), list) or not report["Results"]:
              raise SystemExit("Trivy input has no matched results; scan is unverified.")
          PY
          python3 .github/scripts/trivy-gate.py report "$RUNNER_TEMP/trivy.json" \
            --findings-json "$RUNNER_TEMP/trivy-findings.json" \
            --github-output "$GITHUB_OUTPUT" |
            tee "$RUNNER_TEMP/trivy-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Record architecture scan status
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
          REPORT_RESULT: ${{ steps.report.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          status = "success" if os.environ["REPORT_RESULT"] == "success" else "failed"
          Path(os.environ["RUNNER_TEMP"], "scan-status.json").write_text(
              json.dumps({"arch": os.environ["ARCH"], "status": status}) + "\n")
          PY

      - name: Preserve sanitized scan findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-image-findings-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/scan-status.json
            ${{ runner.temp }}/image-provenance.json
            ${{ runner.temp }}/trivy-findings.json
            ${{ runner.temp }}/trivy-report.md
            ${{ runner.temp }}/trivy-version.txt
          if-no-files-found: error

  report:
    needs:
      - resolve
      - scan
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download both architecture reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for arch in amd64 arm64; do
            if ! gh run download "$RUN_ID" --name "development-image-findings-${arch}" \
                --dir "$RUNNER_TEMP/findings/$arch"; then
              printf 'Report for %s is unavailable; the aggregate will fail.\n' "$arch" >&2
            fi
          done

      - id: aggregate
        name: Aggregate both architecture reports
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          result=0
          python3 .github/scripts/dev-image-report.py "$RUNNER_TEMP/findings" \
            --scan-result "$SCAN_RESULT" --body "$RUNNER_TEMP/trivy-report.md" \
            --github-output "$GITHUB_OUTPUT" || result=$?
          cat "$RUNNER_TEMP/trivy-report.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Maintain vulnerability issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HAS_FINDINGS: ${{ steps.aggregate.outputs.has_findings }}
          SCAN_STATUS: ${{ steps.aggregate.outputs.status }}
          REPORT_OUTCOME: ${{ steps.aggregate.outcome }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status=failed
          if [[ "$SCAN_STATUS" == success && "$REPORT_OUTCOME" == success && "$JOB_STATUS" == success ]]; then
            case "$HAS_FINDINGS" in
              true) status=findings ;;
              false) status=clear ;;
            esac
          fi
          python3 .github/scripts/tracking-issue.py --title "開発用イメージの脆弱性" \
            --status "$status" --body-file "$RUNNER_TEMP/trivy-report.md" --run-url "$RUN_URL"

name: 固定版の更新確認

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: monitor-pins
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        name: 固定版を確認
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/pins.md"
          python3 .github/scripts/check-pins.py upstream --report "$report" \
            > "$RUNNER_TEMP/pins-status.txt"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Update tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          status=failed
          if [[ "$CHECK_OUTCOME" == success ]]; then
            case "$(cat "$RUNNER_TEMP/pins-status.txt")" in
              全て最新) status=clear ;;
              更新あり) status=findings ;;
            esac
          fi
          python3 .github/scripts/tracking-issue.py --title "固定版の更新確認" \
            --status "$status" --body-file "$RUNNER_TEMP/pins.md" --run-url "$run_url"

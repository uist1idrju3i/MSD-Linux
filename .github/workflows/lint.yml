name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned actionlint and ShellCheck
        env:
          ACTIONLINT_VERSION: 1.7.12
          SHELLCHECK_VERSION: 0.11.0
        run: |
          set -euo pipefail
          actionlint_archive="$RUNNER_TEMP/actionlint.tar.gz"
          shellcheck_archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$actionlint_archive"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$actionlint_archive" | sha256sum -c -
          tar -xzf "$actionlint_archive" -C "$RUNNER_TEMP" actionlint

          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            -o "$shellcheck_archive"
          printf '%s  %s\n' \
            8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 \
            "$shellcheck_archive" | sha256sum -c -
          tar -xJf "$shellcheck_archive" \
            -C "$RUNNER_TEMP" \
            --strip-components=1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          chmod +x "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/shellcheck"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint .github/workflows/*.yml

      - name: Check duplicated pins
        run: python3 .github/scripts/check-pins.py consistency

      - name: Test pin checker
        run: tests/check-pins/run.sh

      - name: サイト状態確認をテスト
        run: tests/check-site-status/run.sh

      - name: Run ShellCheck on tracked shell scripts
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          scripts = []
          for raw_path in paths:
              if not raw_path:
                  continue
              path = os.fsdecode(raw_path)
              if path.startswith("vendor/") or not os.path.isfile(path):
                  continue
              with open(path, "rb") as source:
                  first_line = source.readline()
              if path.endswith(".sh") or re.match(
                  rb"^#!.*(?:/|\s)(?:sh|bash)(?:\s|$)", first_line
              ):
                  scripts.append(path)

          if scripts:
              subprocess.run(["shellcheck", *scripts], check=True)
          PY

  zizmor:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create isolated Python environment
        run: python3 -m venv "$RUNNER_TEMP/zizmor-venv"

      - name: Install pinned zizmor
        run: |
          "$RUNNER_TEMP/zizmor-venv/bin/pip" install \
            --no-deps \
            --require-hashes \
            -r .github/zizmor-requirements.txt

      - name: Audit workflows offline
        run: |
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" \
            --offline \
            --format=github \
            .github/workflows/

  dockerfile-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Third-party actions are not on the repository allowlist, so run the pinned image directly.
      - name: Lint development Dockerfile
        env:
          HADOLINT_VERSION: 2.15.1
          HADOLINT_DIGEST: sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27
        run: |
          docker run --rm -i \
            -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" \
            "ghcr.io/hadolint/hadolint:v${HADOLINT_VERSION}-debian@${HADOLINT_DIGEST}" \
            hadolint --config /.config/hadolint.yaml - < docker/msd-dev.Dockerfile

      - name: Check Dockerfile build
        run: docker build --check -f docker/msd-dev.Dockerfile .

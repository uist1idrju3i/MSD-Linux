name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GHCR_ACTOR" \
            --password-stdin

      - name: Ensure development image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSD_DEV_REQUIRE_ATTESTATION: "1"
        run: docker/msd-dev ensure

      - name: Run lint checks in the development image
        run: |
          docker/msd-dev bash -c '
            actionlint .github/workflows/*.yml
            python3 .github/scripts/check-pins.py consistency
            tests/check-pins/run.sh
            tests/check-site-status/run.sh
            python3 - << "PY"
            import os
            import re
            import subprocess

            paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
            scripts = []
            for raw_path in paths:
                if not raw_path:
                    continue
                path = os.fsdecode(raw_path)
                if path.startswith("vendor/") or not os.path.isfile(path):
                    continue
                with open(path, "rb") as source:
                    first_line = source.readline()
                if path.endswith(".sh") or re.match(
                    rb"^#!.*(?:/|\s)(?:sh|bash)(?:\s|$)", first_line
                ):
                    scripts.append(path)

            if scripts:
                subprocess.run(["shellcheck", *scripts], check=True)
            PY
          '

  zizmor:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GHCR_ACTOR" \
            --password-stdin

      - name: Ensure development image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSD_DEV_REQUIRE_ATTESTATION: "1"
        run: docker/msd-dev ensure

      - name: Audit workflows offline
        run: docker/msd-dev zizmor --offline --format=github .github/workflows/

  dockerfile-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Third-party actions are not on the repository allowlist, so run the pinned image directly.
      - name: Lint development Dockerfile
        env:
          HADOLINT_VERSION: 2.15.1
          HADOLINT_DIGEST: sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27
        run: |
          docker run --rm -i \
            -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" \
            "ghcr.io/hadolint/hadolint:v${HADOLINT_VERSION}-debian@${HADOLINT_DIGEST}" \
            hadolint --config /.config/hadolint.yaml - < docker/msd-dev.Dockerfile

      - name: Check Dockerfile build
        run: docker build --check -f docker/msd-dev.Dockerfile .

name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - public_html/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: サイトを検査して公開用成果物を作成
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: サイトと Pages のドメインを検査
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cname="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname // ""')"
          python3 .github/scripts/check-site.py --expect-pages-cname "$cname"

      - name: GitHub Pages 用の成果物を作成
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public_html

  deploy:
    name: GitHub Pages に公開
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

# 依存関係の更新を Dependabot に任せる設定。
# vendor/ の外部リポジトリ（git submodule）と GitHub Actions を週次で監視し、
# 更新があれば Dependabot が Pull Request を開きます。
version: 2
updates:
  # vendor/ 配下の git submodule を追跡
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # .github/workflows/ のアクションを追跡
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # .github/zizmor-requirements.txt の固定版を追跡
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # docs/logo/tools/requirements.txt の固定版（ロゴ生成スクリプト用）を追跡
  - package-ecosystem: "pip"
    directory: "/docs/logo/tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # multi-stage の先頭 FROM を週次で監視。各ベースイメージの digest は固定版確認でも照合
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
